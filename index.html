<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14243d"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Инвентаризация</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#17283e;font:14px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px;background:#e9eef6;color:#213a58;font-weight:650}header{position:sticky;top:0;background:#14243d;color:white;z-index:10;padding:calc(8px + env(safe-area-inset-top)) 12px 9px}#searchrow{display:flex;gap:8px}#search{flex:1;min-width:0;border-radius:10px;padding:12px;border:0;font-size:16px}#toggle{background:#314968;color:white;font-size:19px;width:44px}#panel{padding-top:12px}#panel[hidden]{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:9px}.stat{background:#30445e;text-align:center;border-radius:9px;padding:8px 2px}.stat b{display:block;font-size:19px}.stat small{font-size:10px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}.buttons button{padding:11px 5px}select{width:100%;padding:10px;border-radius:10px;border:0;margin-bottom:6px}.progress-track{height:5px;background:#dbe3ec;border-radius:6px;margin-bottom:9px;overflow:hidden}#progress{height:100%;background:#27866a;width:0%;transition:width .2s}main{max-width:720px;margin:auto;padding:10px 10px 80px}.muted{color:#65748a;font-size:12px;line-height:1.5}.card{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;margin-bottom:7px}.top{font-size:11px;color:#718096;display:flex;justify-content:space-between}.name{font-weight:750;margin:5px 0;font-size:14px}.detail{font-size:11px;color:#52647c;line-height:1.5;overflow-wrap:anywhere}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:8px}.actions button{padding:9px 3px;font-size:12px}.actions .on.yes{background:#bff2d4;color:#125738}.actions .on.no{background:#ffcfcc;color:#8a2424}.actions .on.wait{background:#d8e3ff;color:#294c91}.note{margin-top:7px;border:1px solid #e1e6ef;border-radius:8px;padding:9px;width:100%;font-size:13px}#message{color:#c8e4fc;font-size:12px;min-height:15px}#upload{display:none}.hint{color:#d5e0ef;font-size:12px}#empty{padding:35px 15px;text-align:center;background:white;border-radius:12px}.secondary{background:#dbe7f4}#loadmore{width:100%;margin:10px 0}
</style></head><body><header><div id="searchrow"><input id="search" placeholder="🔎 Поиск по имуществу и номерам" autocomplete="off"><button id="toggle" aria-label="Меню">☰</button></div><div id="panel" hidden><div class="stats"><div class="stat"><b id="total">0</b><small>Всего</small></div><div class="stat"><b id="found">0</b><small>Найдено</small></div><div class="stat"><b id="missing">0</b><small>Нет</small></div><div class="stat"><b id="pending">0</b><small>Осталось</small></div></div><select id="group"><option value="">Обе категории</option><option value="H">От 500 тыс.</option><option value="L">До 500 тыс.</option></select><select id="status"><option value="">Все статусы</option><option value="wait">Не проверено</option><option value="yes">Найдено</option><option value="no">Не найдено</option></select><select id="city"><option value="">Все местонахождения</option></select><select id="mol"><option value="">Все МОЛ</option></select><div class="buttons"><button id="import">📂 Загрузить Excel</button><button id="backup">💾 Резервная копия</button><button id="restore">↩ Восстановить</button><button id="excelH">Excel от 500 тыс.</button><button id="excelL">Excel до 500 тыс.</button><button id="reset">Сбросить фильтры</button></div><div class="hint">Excel-файлы обрабатываются на iPhone. Отметки хранятся на этом iPhone. После каждой серии проверок сохраняй JSON-копию в «Файлы» или iCloud Drive. Для офлайн-работы сначала установи приложение на экран «Домой».</div><div id="message"></div></div></header><main><div class="progress-track"><div id="progress"></div></div><div class="muted" id="summary"></div><div id="list"></div><button id="loadmore" hidden>Показать ещё</button></main><input id="upload" type="file" accept=".xlsx,.json" multiple><script src="app.js"></script></body></html>
